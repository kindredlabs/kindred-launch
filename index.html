<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindred</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg: #0a0a0a; --text: #e8e4df; --dim: #5a554f; --accent: #c9b99a; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .page { width: 100%; max-width: 800px; padding: 40px 24px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .lines { text-align: center; margin-bottom: 60px; }
  .line { font-family: 'Instrument Serif', serif; font-size: clamp(28px, 5.5vw, 52px); line-height: 1.25; margin-bottom: 20px; opacity: 0; color: var(--text); }
  .line.visible { opacity: 1; }
  .line .cursor { display: inline-block; width: 2px; height: 0.85em; background: var(--accent); margin-left: 3px; vertical-align: text-bottom; animation: blink 0.6s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .brown-video-wrap {
    width: 160px;
    height: 200px;
    margin: 0 auto 50px;
    opacity: 0;
    transform: translateY(20px) scale(0.9);
    transition: opacity 0.8s ease, transform 0.8s ease;
    position: relative;
  }
  .brown-video-wrap.visible { opacity: 1; transform: translateY(0) scale(1); }
  .brown-video-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .bottom { text-align: center; opacity: 0; transition: opacity 1s ease; }
  .bottom.visible { opacity: 1; }
  .date { font-family: 'Instrument Serif', serif; font-size: clamp(18px, 3.5vw, 26px); color: var(--text); margin-bottom: 36px; }
  .signup-row { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 14px; opacity: 0; transition: opacity 0.8s ease; }
  .signup-row.visible { opacity: 1; }
  .input-group { display: flex; }
  .input-group input { background: transparent; border: 1px solid #333; padding: 12px 18px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; width: 220px; outline: none; transition: border-color 0.3s; }
  .input-group input::placeholder { color: #444; }
  .input-group input:focus { border-color: var(--accent); }
  .input-group button { background: transparent; border: 1px solid #333; border-left: none; padding: 12px 20px; color: var(--dim); font-family: 'DM Sans', sans-serif; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: color 0.3s, border-color 0.3s; white-space: nowrap; }
  .input-group button:hover { color: var(--accent); border-color: var(--accent); }
  .waitlist-count { font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--dim); }
  .waitlist-count .num { color: var(--accent); font-weight: 500; font-variant-numeric: tabular-nums; }
  .logo { height: 28px; opacity: 0.7; margin-top: 30px; }
</style>
</head>

  cur.className = 'cursor';
  function tick() {
    el.textContent = text.slice(0, i);
    el.appendChild(cur);
    if (i < text.length) { i++; setTimeout(tick, 35 + Math.random() * 30); }
    else { setTimeout(() => { if (cur.parentNode) cur.remove(); if (cb) cb(); }, 300); }
  }
  tick();
}

function runStep() {
  if (currentStep >= sequence.length) return;
  const step = sequence[currentStep]; currentStep++;
  if (step.text) {
    const el = createLineEl(step.italic); linesEl.appendChild(el);
    typeText(el, step.text, () => setTimeout(runStep, step.delay));
  } else if (step.action === 'revealBrown') {
    brownWrap.classList.add('visible');
    setTimeout(runStep, step.delay);
  } else if (step.action === 'showBottom') {
    bottomEl.classList.add('visible');
    setTimeout(() => { signupRow.classList.add('visible'); tickWaitlist(); }, 600);
  }
}
setTimeout(runStep, 800);
</script>
</body>
